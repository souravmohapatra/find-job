# Public-job fetch egress only. Never publish this proxy port on the host.
http_port 3128
visible_hostname jobfinder-egress
acl safe_ports port 80 443
acl tls_ports port 443
acl CONNECT method CONNECT
acl read_methods method GET HEAD CONNECT
acl nonpublic dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8
acl nonpublic dst 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24
acl nonpublic dst 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24
acl nonpublic dst 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl ipv4 dst 0.0.0.0/1 128.0.0.0/1
acl nonglobal_ipv6 dst ::/3 4000::/2 8000::/1
acl ipv6 dst ::/0
acl global_ipv6 dst 2000::/3
acl reserved_ipv6 dst 2001::/23 2001:db8::/32 2002::/16 3fff::/20
http_access deny !safe_ports
http_access deny CONNECT !tls_ports
http_access deny !read_methods
# Squid represents IPv4 in mapped IPv6 space; allow remaining IPv4
# before applying the IPv6-only ranges, after all common denials.
http_access deny nonpublic
http_access allow ipv4
http_access deny nonglobal_ipv6
http_access deny ipv6 !global_ipv6
http_access deny reserved_ipv6
http_access allow all
pinger_enable off
cache deny all
cache_mem 16 MB
maximum_object_size 0 KB
access_log none
cache_log /dev/stderr
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp
forwarded_for delete
request_header_access X-Forwarded-For deny all
connect_timeout 10 seconds
request_timeout 30 seconds
read_timeout 30 seconds
shutdown_lifetime 1 seconds
