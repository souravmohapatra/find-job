[project]
name = "jobfinder"
version = "0.1.0"
description = "Private company job monitoring and broad AI shortlisting"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary,pool]>=3.2,<4", "alembic>=1.14,<2",
  "procrastinate>=3,<4", "argon2-cffi>=23,<26", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "tzdata>=2025.1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
